<body>
<canvas id="c" width="1920" height="1080"></canvas>
<button id="play">PLAY FILM WITH SOUND</button>
<script>
const W = 1920, H = 1080, TAU = Math.PI * 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const COL = { red: '#c74634', redHi: '#ff6a4d', blue: '#0078d4', blueHi: '#4cb0ff', silver: '#c4ccd8', white: '#f4f6fa', mute: '#7f8ca5' };
const RGB = { b: '76,176,255', r: '255,106,77', s: '196,204,216', w: '244,246,250' };
const DF = '"Segoe UI Variable Display","Segoe UI",sans-serif', UF = 'Consolas,monospace';
const BEATS = window.BEATS || { offset: 0.011062, period: 0.500019 };
const beatAt = t => (t - BEATS.offset) / BEATS.period;

// ------------------------------------------------------------------ math
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const RT = (() => { const r = mulberry32(7); return Array.from({ length: 8192 }, () => r()); })();
const rnd = i => RT[((Math.floor(i) % 8192) + 8192) % 8192];
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const map = (x, a, b) => clamp((x - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const fract = x => x - Math.floor(x);
const smooth = x => x * x * (3 - 2 * x);
const oExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const iExpo = x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10);
const ioCubic = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const oCubic = x => 1 - Math.pow(1 - x, 3);
const oBack = (x, s = 1.70158) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
const spring = (x, k = 6, w = 11) => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.exp(-k * x) * Math.cos(w * x);
function keyed(b, keys, ease = ioCubic) {
  if (b <= keys[0][0]) return keys[0][1];
  for (let i = 0; i < keys.length - 1; i++) {
    const [b0, v0] = keys[i], [b1, v1] = keys[i + 1];
    if (b < b1) return lerp(v0, v1, ease(map(b, b0, b1)));
  }
  return keys[keys.length - 1][1];
}
function keyedV(b, keys, ease = ioCubic) {
  if (b <= keys[0][0]) return keys[0][1];
  for (let i = 0; i < keys.length - 1; i++) {
    const [b0, v0] = keys[i], [b1, v1] = keys[i + 1];
    if (b < b1) { const u = ease(map(b, b0, b1)); return v0.map((x, j) => lerp(x, v1[j], u)); }
  }
  return keys[keys.length - 1][1];
}
function fib(i, n, r) { const y = 1 - 2 * (i + 0.5) / n, rr = Math.sqrt(1 - y * y), th = i * 2.399963; return [Math.cos(th) * rr * r, y * r, Math.sin(th) * rr * r]; }
const norm = v => { const l = Math.hypot(...v) || 1; return v.map(x => x / l); };
const rotY = (p, a) => { const c = Math.cos(a), s = Math.sin(a); return [p[0] * c + p[2] * s, p[1], -p[0] * s + p[2] * c]; };
const rotX = (p, a) => { const c = Math.cos(a), s = Math.sin(a); return [p[0], p[1] * c - p[2] * s, p[1] * s + p[2] * c]; };
const lerp3 = (a, b, u) => [lerp(a[0], b[0], u), lerp(a[1], b[1], u), lerp(a[2], b[2], u)];

// ------------------------------------------------------------------ 3D camera
function lookAt(E, T, f = 1100, cx = W / 2, cy = H / 2) {
  let fx = T[0] - E[0], fy = T[1] - E[1], fz = T[2] - E[2]; const fl = Math.hypot(fx, fy, fz); fx /= fl; fy /= fl; fz /= fl;
  let rx = fz, rz = -fx; const rl = Math.hypot(rx, rz) || 1e-6; rx /= rl; rz /= rl;
  const ux = fy * rz, uy = fz * rx - fx * rz, uz = -fy * rx;
  return { E, fx, fy, fz, rx, rz, ux, uy, uz, f, cx, cy };
}
function proj(c, x, y, z) {
  const dx = x - c.E[0], dy = y - c.E[1], dz = z - c.E[2];
  const Z = dx * c.fx + dy * c.fy + dz * c.fz; if (Z < 25) return null;
  const X = dx * c.rx + dz * c.rz, Y = dx * c.ux + dy * c.uy + dz * c.uz, k = c.f / Z;
  return [c.cx + X * k, c.cy - Y * k, k, Z];
}
const P3 = (c, p) => proj(c, p[0], p[1], p[2]);

// ------------------------------------------------------------------ drawing
function sprite(rgb) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, `rgba(${rgb},1)`); gr.addColorStop(0.14, `rgba(${rgb},0.62)`);
  gr.addColorStop(0.4, `rgba(${rgb},0.13)`); gr.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return c;
}
const SP = { b: sprite(RGB.b), r: sprite(RGB.r), s: sprite(RGB.s), w: sprite(RGB.w) };
function glow(x, y, s, k, a = 1) { if (a <= 0.004 || s < 0.6) return; ctx.globalAlpha = Math.min(1, a); ctx.drawImage(SP[k], x - s / 2, y - s / 2, s, s); }
function glowWH(x, y, w, h, k, a = 1) { if (a <= 0.004) return; ctx.globalAlpha = Math.min(1, a); ctx.drawImage(SP[k], x - w / 2, y - h / 2, w, h); }
function add(fn) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; fn(); ctx.restore(); }
function setFont(size, w = 400, fam = DF, track = 0) { ctx.font = `${w} ${size}px ${fam}`; ctx.letterSpacing = `${track}px`; }
function text(s, x, y, size, color, { w = 400, fam = DF, track = 0, align = 'left', alpha = 1 } = {}) {
  if (alpha <= 0) return;
  setFont(size, w, fam, track); ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  ctx.globalAlpha = Math.min(1, alpha); ctx.fillStyle = color; ctx.fillText(s, align === 'center' ? x + track / 2 : x, y); ctx.globalAlpha = 1;
}
function tw(s, size, w = 400, fam = DF, track = 0) { setFont(size, w, fam, track); return ctx.measureText(s).width; }
function rise(s, x, y, size, color, p, opt = {}, q = 0) {
  if (p <= 0 || q >= 1) return;
  const h = size * 1.32;
  ctx.save(); ctx.beginPath(); ctx.rect(-60, y - size * 1.04, W + 120, h); ctx.clip();
  text(s, x, y + (1 - p) * h - q * h, size, color, opt); ctx.restore();
}
const typed = (s, b, b0, b1) => s.slice(0, Math.floor(s.length * map(b, b0, b1)));
function strokePts(P, color, w, alpha = 1) {
  if (P.length < 2 || alpha <= 0) return;
  ctx.globalAlpha = Math.min(1, alpha); ctx.strokeStyle = color; ctx.lineWidth = w; ctx.beginPath();
  P.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke(); ctx.globalAlpha = 1;
}
function partial(P, prog) {
  if (prog >= 1) return P; if (prog <= 0 || P.length < 2) return [];
  const Ls = []; let tot = 0;
  for (let i = 1; i < P.length; i++) { const d = Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]); Ls.push(d); tot += d; }
  let rem = tot * prog; const out = [P[0]];
  for (let i = 1; i < P.length; i++) {
    if (rem >= Ls[i - 1]) { out.push(P[i]); rem -= Ls[i - 1]; }
    else { const u = rem / (Ls[i - 1] || 1); out.push([lerp(P[i - 1][0], P[i][0], u), lerp(P[i - 1][1], P[i][1], u)]); break; }
  }
  return out;
}
function pointOn3(pts, u) {
  const Ls = []; let tot = 0;
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1], pts[i][2] - pts[i - 1][2]); Ls.push(d); tot += d; }
  let rem = clamp(u) * tot;
  for (let i = 1; i < pts.length; i++) { if (rem <= Ls[i - 1]) return lerp3(pts[i - 1], pts[i], rem / (Ls[i - 1] || 1)); rem -= Ls[i - 1]; }
  return pts[pts.length - 1];
}
function metal(y0, y1) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.55, '#e4e9f1'); g.addColorStop(1, '#9aa7ba'); return g;
}
function hex(x, y, r) { ctx.beginPath(); for (let k = 0; k < 6; k++) { const a = Math.PI / 6 + k * Math.PI / 3; k ? ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r) : ctx.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r); } ctx.closePath(); }

const BG = (() => {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  const gr = g.createRadialGradient(960, 560, 0, 960, 560, 1250);
  gr.addColorStop(0, '#0e1f42'); gr.addColorStop(0.55, '#071330'); gr.addColorStop(1, '#02060f');
  g.fillStyle = gr; g.fillRect(0, 0, W, H); return c;
})();
const VIG = (() => {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  const gr = g.createRadialGradient(960, 540, 420, 960, 540, 1180);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.62)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H); return c;
})();
const GRAIN = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  const id = g.createImageData(256, 256), r = mulberry32(5);
  for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  g.putImageData(id, 0, 0); return c;
})();
function grain(t) {
  const f = Math.round(t * 60), ox = Math.floor(rnd(f * 3) * 256), oy = Math.floor(rnd(f * 3 + 1) * 256);
  ctx.save(); ctx.globalAlpha = 0.035; ctx.globalCompositeOperation = 'overlay';
  for (let y = -oy; y < H; y += 256) for (let x = -ox; x < W; x += 256) ctx.drawImage(GRAIN, x, y);
  ctx.restore();
}

// =================================================================== S1 ECOSYSTEM  (b 0-24)
const R1 = mulberry32(11);
const DUST = Array.from({ length: 900 }, () => [(R1() - .5) * 7000, (R1() - .5) * 4200, R1() * 8000 - 1500, R1()]);
const LC = [0, 0, 3400];
const CLUS = [[-1450, 420, 2700, 'b', 'ERP CLOUD'], [1350, 560, 3300, 'r', 'OCI'], [-1050, -560, 3900, 's', 'HCM CLOUD'],
  [1500, -430, 2600, 'b', 'AZURE'], [80, 900, 4500, 's', 'EPM'], [-380, -780, 2400, 'r', 'INTEGRATION'], [700, -60, 5100, 'b', 'AI AGENTS']];
const NPC = 60, NLAT = CLUS.length * NPC;
const LAT = Array.from({ length: NLAT }, (_, i) => fib(i, NLAT, 640));
const CPTS = [], LPT = new Array(NLAT);
(() => {
  const used = new Uint8Array(NLAT);
  CLUS.forEach((c, ci) => {
    const d = norm([c[0] - LC[0], c[1] - LC[1], c[2] - LC[2]]), cand = [];
    for (let j = 0; j < NLAT; j++) if (!used[j]) cand.push([j, LAT[j][0] * d[0] + LAT[j][1] * d[1] + LAT[j][2] * d[2]]);
    cand.sort((a, b) => b[1] - a[1]);
    for (let k = 0; k < NPC; k++) { const j = cand[k][0]; used[j] = 1; LPT[j] = CPTS.length; CPTS.push([ci, fib(k, NPC, 105 + R1() * 35), j]); }
  });
})();
const LEDGE = []; for (let i = 0; i < NLAT; i++) { if (i + 21 < NLAT) LEDGE.push([i, i + 21]); if (i + 34 < NLAT) LEDGE.push([i, i + 34]); }
const STREAMS = [[0, 5], [5, 2], [2, 6], [6, 1], [1, 3], [3, 0], [0, 4], [4, 1], [5, 6], [2, 3]];
const lightAt = ci => 1 + ci;

function s1(b) {
  ctx.drawImage(BG, 0, 0);
  const u = ioCubic(clamp(b / 24));
  const cam = lookAt([lerp(-260, 180, u) + 110 * Math.sin(b * 0.11), lerp(160, -40, u), keyed(b, [[0, -700], [22, 1150], [24, 1500]])], LC, 1100);
  const conv = ioCubic(map(b, 8, 15.5)), col = ioCubic(map(b, 22.2, 23.5));
  const ang = Math.max(0, b - 8) * 0.05;

  add(() => {
    for (const [x, y, z, r] of DUST) {
      const p = proj(cam, x, y, z); if (!p) continue;
      glow(p[0], p[1], Math.max(2, (2 + r * 3) * p[2] * 5), r > 0.86 ? 'b' : 's', 0.32 * clamp(p[2] * 2.2) * (1 - col * 0.6));
    }
  });

  // streams between platforms
  add(() => {
    STREAMS.forEach(([a, c], e) => {
      const s0 = Math.max(lightAt(a), lightAt(c)), al = map(b, s0 + 0.2, s0 + 1.0) * (1 - conv);
      if (al <= 0) return;
      const A = CLUS[a], C = CLUS[c], pt = v => [lerp(A[0], C[0], v), lerp(A[1], C[1], v) + Math.sin(Math.PI * v) * 220, lerp(A[2], C[2], v)];
      const line = []; for (let k = 0; k <= 20; k++) { const p = P3(cam, pt(k / 20)); if (p) line.push(p); }
      strokePts(line, `rgba(${RGB.b},1)`, 1, 0.16 * al);
      for (let k = 0; k < 12; k++) {
        const p = P3(cam, pt(fract(b * 0.3 + k / 12 + e * 0.37))); if (!p) continue;
        glow(p[0], p[1], 26 * p[2] * 2.2, k % 4 ? 'b' : 'w', 0.8 * al);
      }
    });
  });

  // platform points -> lattice
  const pos = CPTS.map(([ci, o, j], i) => {
    const c = CLUS[ci], br = 1 + 0.06 * Math.sin(b * 0.9 + ci);
    const a = [c[0] + o[0] * br, c[1] + o[1] * br, c[2] + o[2] * br];
    const L0 = rotY(LAT[j], ang), tg = [LC[0] + L0[0], LC[1] + L0[1], LC[2] + L0[2]];
    const e = ioCubic(map(b, 8 + ci * 0.35 + (i % NPC) / NPC * 0.6, 13.5 + ci * 0.25));
    let p = [lerp(a[0], tg[0], e), lerp(a[1], tg[1], e) + Math.sin(Math.PI * e) * 160 * (ci % 2 ? 1 : -1), lerp(a[2], tg[2], e)];
    if (col > 0) p = lerp3(p, LC, col);
    return p;
  });
  const PP = pos.map(p => P3(cam, p));
  const latA = map(conv, 0.6, 1) * 0.24 * (1 - col);
  if (latA > 0) {
    ctx.save(); ctx.globalAlpha = latA; ctx.strokeStyle = `rgba(${RGB.s},1)`; ctx.lineWidth = 1; ctx.beginPath();
    for (const [i, j] of LEDGE) { const a = PP[LPT[i]], c = PP[LPT[j]]; if (a && c) { ctx.moveTo(a[0], a[1]); ctx.lineTo(c[0], c[1]); } }
    ctx.stroke(); ctx.restore();
  }
  add(() => {
    const pulse = b >= 9 ? [9, 11, 13, 15, 16].reduce((m, pb) => Math.max(m, b >= pb ? Math.exp(-(b - pb) * 2.2) : 0), 0) : 0;
    PP.forEach((p, i) => {
      if (!p) return;
      const ci = CPTS[i][0], L = lightAt(ci);
      const lit = b < L ? 0.45 : 0.6 + 0.4 * Math.exp(-(b - L) * 1.2);
      const wave = Math.exp(-Math.pow(LAT[CPTS[i][2]][1] / 640 - (fract((b - 9) / 2) * 2.4 - 1.2), 2) * 30) * (b > 9 ? 0.6 : 0);
      glow(p[0], p[1], 22 * p[2] * 2.4, CLUS[ci][3] === 'r' && conv < 0.5 ? 'r' : (i % 9 === 0 ? 'b' : 'w'), Math.min(1, lit * (1 - conv * 0.3) + wave * conv + pulse * 0.4));
    });
    CLUS.forEach((c, ci) => {
      const p = P3(cam, c); if (!p) return;
      const L = lightAt(ci), lit = b < L ? 0.3 : 0.5 + 0.5 * Math.exp(-(b - L) * 1.4);

    if (cp && col > 0) {
      const st = oExpo(map(b, 23.3, 24));

      glowWH(cp[0], cp[1], lerp(240, 4600, st), lerp(240, 22, st), 'w', col);

  CLUS.forEach((c, ci) => {
    const p = P3(cam, c); if (!p) return;
    const L = lightAt(ci), pIn = oExpo(map(b, L + 0.05, L + 0.6)), q = iExpo(map(b, 8 + ci * 0.35, 8.5 + ci * 0.35));
    if (pIn <= 0 || q >= 1) return;

    ctx.globalAlpha = 0.6 * pIn * (1 - q); ctx.fillStyle = COL.silver; ctx.fillRect(lx - 0.5, ly + 12, 1, 26 * pIn); ctx.globalAlpha = 1;
    rise(c[4], lx, ly, 20, c[3] === 'r' ? COL.redHi : COL.silver, pIn, { fam: UF, track: 5, align: 'center' }, q);

    ctx.fillText('SHAIK MOHAMMAD MUSTHAFA', 960 + tr / 2, ny - out * 160);
    ctx.restore();

    ctx.fillStyle = COL.red; ctx.fillRect(960 - rw / 2, 566, rw, 3);

    const ws = parts.map(s => tw(s, 40, 300, DF, 2)), tot = ws.reduce((a, c) => a + c, 0) + GAP * 2;

}

// =================================================================== S2 CAREER  (b 24-48)
const MS = [
  { b: 24, x: 0, y: -300, yr: '2012', co: 'WIPRO TECHNOLOGIES', role: 'Project Engineer  /  ERP Technical Consultant', note: 'EBS 11i \u2192 R12 upgrade  \u00b7  WebADI & PL/SQL ingestion  \u00b7  AME audit controls' },
  { b: 30, x: 1500, y: -110, yr: '2015', co: 'DELOITTE CONSULTING', role: 'Technical Track Lead  /  Enterprise Solutions Consultant', note: 'Cloud Conversion Accelerator  \u00b7  100% conversion success' },
  { b: 36, x: 2900, y: 90, yr: '2019', co: 'GAP INC.', role: 'Senior Integration Systems Architect', note: 'EBS Site Hub & Stibo migration  \u00b7  zero operational downtime' },
  { b: 40, x: 4100, y: 300, yr: '2020', co: 'PROVIDENCE GLOBAL CENTER', role: 'Lead  \u2192  Principal  \u2192  Senior Principal Solutions Architect', note: 'EBAT target architecture  \u00b7  Agentic AI  \u00b7  enterprise cloud migration' },
];
const TARGET = { x: 5300, y: 640 };
const HEADK = [[23.9, -1600], [24.5, 0], [28.3, 0], [30, 1500], [34.3, 1500], [36, 2900], [38.5, 2900], [40, 4100], [42.9, 4100], [44.5, 5300]];
const COPY_END = [28.2, 34.2, 38.4, 42.8];
const STEPS = [[4290, 41], [4480, 41.75], [4670, 42.5]];
function pathY(x) {
  if (x <= 0) return MS[0].y;

  for (let i = 0; i < pts.length - 1; i++) { const [x0, y0] = pts[i], [x1, y1] = pts[i + 1]; if (x <= x1) return lerp(y0, y1, smooth(clamp((x - x0) / (x1 - x0)))); }
  return TARGET.y;
}

    const p = P3(cam, xs([0, -690, 0])); if (p) rise('OIC  \u00b7  CONTROL-M  \u00b7  MFTe  \u00b7  BOOMI', p[0], p[1], 18, COL.silver, oExpo(map(b, 96, 96.6)), { fam: UF, track: 4, align: 'center' }, q);
  }
  const bar = oExpo(map(b, CB[k], CB[k] + 0.4)) * (1 - map(b, 103.2, 103.7));
  ctx.fillStyle = COL.red; ctx.fillRect(84, 640 - 210 * bar, 3, 210 * bar);
  CO.forEach(([big, small], i) => {
    const end = i < 5 ? CB[i + 1] : 103.6;
    if (b < CB[i] || b >= end) return;
    const q = iExpo(map(b, end - 0.3, end));
    let s = big;
    if (i === 0) s = Math.round(13 * oExpo(map(b, 86, 87.2))) + '+';
    if (i === 5) s = Math.round(20 * oExpo(map(b, 101, 102.2))) + '+';
    rise(s, 110, 560, 150, COL.white, oExpo(map(b, CB[i], CB[i] + 0.45)), { w: 300 }, q);
    rise(small, 116, 622, 28, COL.silver, oExpo(map(b, CB[i] + 0.12, CB[i] + 0.6)), { w: 600, track: 6 }, q);
  });
}

// =================================================================== S6 FINALE  (b 104-120)
const R6 = mulberry32(66), TOW = [];
for (let i = 0; i < 13; i++) for (let j = 0; j < 13; j++) {
  if (i === 3 || i === 9 || j === 3 || j === 9) continue;
  const core = i === 6 && j === 6, dc = Math.hypot(i - 6, j - 6);
  TOW.push({ x: (i - 6) * 230, z: (j - 6) * 230, fw: core ? 170 : 110 + R6() * 60, h: core ? 1700 : 120 + Math.pow(R6(), 2.2) * 820 + Math.max(0, 5 - dc) * 110, c: core ? 'r' : R6() < 0.12 ? 'r' : R6() < 0.55 ? 'b' : 's', core, id: TOW.length });
}
const AVE = [[-690, 'x'], [690, 'x'], [-690, 'z'], [690, 'z']];
const DRONES = Array.from({ length: 40 }, () => [400 + R6() * 1100, 350 + R6() * 600, R6() * TAU, (R6() < 0.5 ? -1 : 1) * (0.1 + R6() * 0.12), R6() < 0.2 ? 'r' : 'w']);
const CORE_TOP = [0, 1700, 0];
const TITLES = [[106, 'TECHNICAL FELLOW', 360], [108, 'ENTERPRISE ARCHITECT', 470], [110, 'AI INNOVATOR', 580]];
function camS6(b) {
  const E = keyedV(b, [[104, [-1750, 380, -2050]], [112, [1350, 1500, -2100]], [120, [450, 3100, -2700]]]);
  const T = keyedV(b, [[104, [0, 520, 0]], [112, [0, 700, 0]], [120, [0, 520, 0]]]);
  return lookAt(E, T, 1100);
}
function towerDraw(cam, T, b) {
  const { x, z, fw, h } = T, hw = fw / 2, E = cam.E;
  const faces = [
    [[0, 0, -1], [[x - hw, 0, z - hw], [x + hw, 0, z - hw], [x + hw, h, z - hw], [x - hw, h, z - hw]], '#0b1a38'],
    [[0, 0, 1], [[x + hw, 0, z + hw], [x - hw, 0, z + hw], [x - hw, h, z + hw], [x + hw, h, z + hw]], '#0b1a38'],
    [[-1, 0, 0], [[x - hw, 0, z + hw], [x - hw, 0, z - hw], [x - hw, h, z - hw], [x - hw, h, z + hw]], '#08142c'],
    [[1, 0, 0], [[x + hw, 0, z - hw], [x + hw, 0, z + hw], [x + hw, h, z + hw], [x + hw, h, z - hw]], '#08142c'],
  ];
  const ec = T.c === 'r' ? COL.redHi : T.c === 'b' ? COL.blueHi : COL.silver;
  for (const [n, q, fill] of faces) {
    const cx = (q[0][0] + q[2][0]) / 2, cz = (q[0][2] + q[2][2]) / 2;
    if ((E[0] - cx) * n[0] + (E[2] - cz) * n[2] <= 0) continue;
    const P = q.map(p => P3(cam, p)); if (P.some(p => !p)) continue;
    ctx.beginPath(); P.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
    if (P[0][3] < 4200) {
      ctx.strokeStyle = T.c === 'r' ? 'rgba(255,140,110,0.5)' : 'rgba(170,215,255,0.45)'; ctx.lineWidth = 1; ctx.beginPath();
      for (let y = 60, lv = 0; y < h - 30; y += 62, lv++) {
        if (rnd(T.id * 97 + lv * 13 + (n[0] + 2) * 5 + (n[2] + 2)) < 0.42) continue;
        if (rnd(T.id * 31 + lv + Math.floor(b * 1.5) * 7) < 0.08) continue;
        const a = P3(cam, lerp3([q[0][0], y, q[0][2]], [q[1][0], y, q[1][2]], 0.14)), c = P3(cam, lerp3([q[0][0], y, q[0][2]], [q[1][0], y, q[1][2]], 0.86));
        if (a && c) { ctx.moveTo(a[0], a[1]); ctx.lineTo(c[0], c[1]); }
      }
      ctx.stroke();
    }
  }
  const top = [[x - hw, h, z - hw], [x + hw, h, z - hw], [x + hw, h, z + hw], [x - hw, h, z + hw]].map(p => P3(cam, p));
  if (top.every(Boolean)) {
    ctx.beginPath(); top.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath();
    if (E[1] > h) { ctx.fillStyle = '#10264f'; ctx.fill(); }
    ctx.strokeStyle = ec; ctx.lineWidth = T.core ? 2.5 : 1.4; ctx.globalAlpha = 0.85; ctx.stroke(); ctx.globalAlpha = 1;
  }
}
function s6(b) {
  ctx.drawImage(BG, 0, 0);
  const cam = camS6(b), conv = ioCubic(map(b, 111, 112.3)) * (1 - oExpo(map(b, 112.3, 114.2)));
  const arrive = oExpo(map(b, 104, 104.9));
  // ground grid + avenues
  ctx.save(); ctx.globalAlpha = 0.08; ctx.strokeStyle = COL.blueHi; ctx.lineWidth = 1; ctx.beginPath();
  for (let g = -1610; g <= 1610; g += 230) {
    let a = P3(cam, [g, 0, -1700]), c = P3(cam, [g, 0, 1700]); if (a && c) { ctx.moveTo(a[0], a[1]); ctx.lineTo(c[0], c[1]); }
    a = P3(cam, [-1700, 0, g]); c = P3(cam, [1700, 0, g]); if (a && c) { ctx.moveTo(a[0], a[1]); ctx.lineTo(c[0], c[1]); }
  }
  ctx.stroke(); ctx.restore();
  add(() => {
    AVE.forEach(([o, ax], a) => {
      const A = ax === 'x' ? [o, 4, -1700] : [-1700, 4, o], C = ax === 'x' ? [o, 4, 1700] : [1700, 4, o];
      const pa = P3(cam, A), pc = P3(cam, C); if (pa && pc) strokePts([pa, pc], COL.blueHi, 2, 0.35 * arrive);
      for (let k = 0; k < 26; k++) {
        let p = lerp3(A, C, fract(b * 0.22 * (a % 2 ? -1 : 1) + k / 26 + a * 0.3));
        p = lerp3(p, CORE_TOP, conv);
        const q = P3(cam, p); if (q) glow(q[0], q[1], 46 * q[2] * 2, k % 5 ? 'b' : 'r', 0.9 * arrive);
      }
    });
    if (b >= 112) for (let n = 0; n < 3; n++) {
      const u = fract((b - 112) / 2.4 + n / 3), r = 500 + u * 1700, P = [];
      for (let k = 0; k <= 96; k++) { const a = k / 96 * TAU, q = P3(cam, [Math.cos(a) * r, 6, Math.sin(a) * r]); if (q) P.push(q); }
      strokePts(P, n === 1 ? COL.redHi : COL.blueHi, 2, (1 - u) * 0.5 * map(b, 112, 112.5));
    }
  });
  TOW.map(T => [T, P3(cam, [T.x, T.h / 2, T.z])]).filter(x => x[1]).sort((a, c) => c[1][3] - a[1][3]).forEach(([T]) => towerDraw(cam, T, b));
  add(() => {
    const ct = P3(cam, CORE_TOP), cb = P3(cam, [0, 5200, 0]);
    if (ct) {
      if (cb) { const h = Math.hypot(cb[0] - ct[0], cb[1] - ct[1]); ctx.save(); ctx.translate(ct[0], ct[1]); ctx.rotate(Math.atan2(cb[1] - ct[1], cb[0] - ct[0]) - Math.PI / 2); glowWH(0, h / 2, 60 * ct[2] * 2, h, 'r', 0.5 * arrive); glowWH(0, h / 2, 18 * ct[2] * 2, h, 'w', 0.7 * arrive); ctx.restore(); }
      glow(ct[0], ct[1], 260 * ct[2] * 2, 'r', 0.9);
      if (b >= 112) { const f = Math.exp(-(b - 112) * 2.2); glow(ct[0], ct[1], 3400 * f, 'w', f); glow(ct[0], ct[1], 4200 * f, 'b', f * 0.8); }
    }
    DRONES.forEach(([r, alt, a0, sp, c]) => {
      const a = a0 + b * sp; let p = [Math.cos(a) * r, alt + 60 * Math.sin(b * 0.7 + a0), Math.sin(a) * r];
      p = lerp3(p, CORE_TOP, conv);
      const q = P3(cam, p); if (q) glow(q[0], q[1], 34 * q[2] * 2, c, 0.95);
    });
  });
  // dim for the final card
  const dim = ioCubic(map(b, 112.6, 113.8));
  if (dim > 0) { ctx.fillStyle = `rgba(3,8,20,${0.55 * dim})`; ctx.fillRect(0, 0, W, H); }
  // titles
  const clp = iExpo(map(b, 111.8, 112.35));
  if (b >= 106 && clp < 1) TITLES.forEach(([tb, s, y], i) => {
    if (b < tb) return;
    const tr = lerp(42, 16, oExpo(map(b, tb, tb + 1.2))), next = i < 2 ? TITLES[i + 1][0] : 999;
    const yy = lerp(y, 470, clp);
    ctx.save(); ctx.translate(0, yy); ctx.scale(1, 1 - clp);
    rise(s, 960, 0, 84, b >= next ? COL.silver : COL.white, oExpo(map(b, tb, tb + 0.5)), { w: 600, track: tr, align: 'center', alpha: b >= next ? 0.72 : 1 });
    ctx.restore();
  });
  // final lockup
  if (b >= 112.8) {
    const wr = oExpo(map(b, 112.8, 114)), tr = lerp(34, 4, oExpo(map(b, 112.8, 115.2)));
    ctx.save(); ctx.beginPath(); ctx.rect(960 - 1000 * wr, 400, 2000 * wr, 150); ctx.clip();
    setFont(100, 300, DF, tr); ctx.textAlign = 'center'; ctx.fillStyle = metal(440, 528); ctx.fillText('Shaik Mohammad Musthafa', 960 + tr / 2, 520); ctx.restore();
    const rw = 440 * oExpo(map(b, 113.4, 114.4)); ctx.fillStyle = COL.red; ctx.fillRect(960 - rw / 2, 562, rw, 3);
    const words = 'Building the Next Generation of Intelligent Enterprises'.split(' '), sp = tw(' ', 36, 400, DF, 2);
    const ws = words.map(w => tw(w, 36, 400, DF, 2)), tot = ws.reduce((a, c) => a + c, 0) + sp * (words.length - 1);
    let x = 960 - tot / 2;
    words.forEach((w, k) => { rise(w, x, 632, 36, k >= 5 ? COL.white : COL.silver, oExpo(map(b, 114 + k * 0.5, 114.55 + k * 0.5)), { w: 400, track: 2 }); x += ws[k] + sp; });
  }
}

// =================================================================== frame
window.seek = t => {
  const b = beatAt(t);
  ctx.reset();
  if (b < 24) s1(b); else if (b < 48) s2(b); else if (b < 68) s3(b); else if (b < 86) s4(b); else if (b < 104) s5(b); else s6(b);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.setLineDash([]);
  ctx.drawImage(VIG, 0, 0);
  grain(t);
  const black = Math.max(1 - map(b, 0, 0.9), ioCubic(map(b, 118.6, 120)));
  if (black > 0) { ctx.fillStyle = `rgba(0,0,0,${black})`; ctx.fillRect(0, 0, W, H); }
};
window.DURATION = 60;

Promise.all([document.fonts.load(`300 100px ${DF}`), document.fonts.load(`600 100px ${DF}`), document.fonts.load(`400 40px ${UF}`)]).then(() => {
  window.ready = true;
  window.seek(9.5);
  if (!window.RENDER) {
    const audio = new Audio('score.m4a'), btn = document.getElementById('play');
    const tick = () => { window.seek(audio.currentTime); if (!audio.paused) requestAnimationFrame(tick); };
    const start = () => { btn.style.display = 'none'; audio.currentTime = 0; audio.play().then(() => requestAnimationFrame(tick)); };
    btn.addEventListener('click', start);
    audio.addEventListener('ended', () => { btn.textContent = 'PLAY AGAIN'; btn.style.display = 'block'; });
  }
});
</script>
